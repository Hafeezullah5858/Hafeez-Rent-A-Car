name: hafeez_rent_a_car
version: 5.2.0+1
description: Hafeez Rent A Car professional fleet, rental, accounting, customer, driver and reporting management app.
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hafeez_horizontal_logo.png
